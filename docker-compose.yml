services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: echo_world
      POSTGRES_USER: echo_world
      POSTGRES_PASSWORD: echo_world_local
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo_world -d echo_world"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - echo_world_db:/var/lib/postgresql/data
      - ./migrations:/migrations:ro

volumes:
  echo_world_db:
